[project]
name = "sfmini-backend"
version = "0.1.0"
description = "软件工厂缩小版 · 后端（方案甲 · 本地可运行版）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.19",
  "httpx>=0.27",
  "cryptography>=42.0",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 云端/增强能力（按需安装；本地 stub 模式无需）
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
docparse = ["pdfminer.six>=20240706", "python-docx>=1.1", "readability-lxml>=0.8"]
ocr = ["paddleocr>=2.7"]
llm = ["anthropic>=0.25"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
