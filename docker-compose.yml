services:
  nginx:
    image: nginx:1.25-alpine
    ports: ["8080:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [backend, frontend]
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://sfmini:${POSTGRES_PASSWORD:-change-me}@postgres:5432/sfmini
      EVENT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      BLOB_DIR: /data/blob
    depends_on: [postgres, redis]
    volumes: ["blob:/data/blob"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  frontend:
    build: ./frontend
    environment:
      BACKEND_ORIGIN: http://backend:8000
    command: npm run start
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: sfmini
      POSTGRES_USER: sfmini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/versions/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
  redis:
    image: redis:7-alpine
    volumes: ["redisdata:/data"]

volumes:
  pgdata: {}
  redisdata: {}
  blob: {}
